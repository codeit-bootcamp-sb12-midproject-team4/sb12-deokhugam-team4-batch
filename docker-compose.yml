services:
  db:
    image: mysql:8.0
    container_name: local-deokhugam-db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: deokhugam
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_USER: user
      MYSQL_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./src/main/resources/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./src/main/resources/05_data.sql:/docker-entrypoint-initdb.d/05_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5