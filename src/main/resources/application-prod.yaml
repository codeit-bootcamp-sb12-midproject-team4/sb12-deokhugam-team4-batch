spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${AWS_AURORA_HOST}:3306/deokhugam?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${AWS_AURORA_USERNAME}
    password: ${AWS_AURORA_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: "gemini-flash-latest"

  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

logging:
  level:
    root: INFO
    org.springframework.batch: DEBUG